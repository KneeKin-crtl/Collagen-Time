[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "collagen-fiber-analyzer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "opencv-python-headless>=4.9,<5", "scikit-image>=0.23,<1", "pandas>=2.2,<4", "streamlit>=1.65,<2", "tifffile>=2024.1", "openpyxl>=3.1.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
browser = ["playwright>=1.65,<2"]
validation = ["matplotlib>=3.10,<4"]

[tool.setuptools.packages.find]
include = ["collagen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
